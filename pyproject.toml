[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opportunity-finder"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pyarrow>=14.0",
    "duckdb>=0.10",
    "langdetect>=1.0.9",
    "python-dotenv>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
